# Override for the synthetic TEST stack, used only with docker-compose.dev.yml by tools/test-stack.sh (project tsr-app-test):
# the same services on other published ports, so it cannot collide with the dev stack (8088, 5433, 19099).
# Literal values on purpose: no shell variable can move the test stack onto dev's ports or the reverse.
services:
  db:
    ports: !override
      - "127.0.0.1:5434:5432"
  firebase-emulator:
    ports: !override
      - "127.0.0.1:19100:9099"
  gateway:
    ports: !override
      - "127.0.0.1:8089:8080"
  # The test stack runs the profile "workers" (tools/test-stack.sh): its API searches the stack's own Elasticsearch, and the
  # two workers that send nothing outward run: search-feed feeds that index, content-refresh copies the content files mounted at
  # /var/tsr/content (the synthetic set of db/synthetic/content). Literal, so no shell variable can switch a sending worker on,
  # and the channel id is empty, so no test stack calls the video feed.
  api:
    environment:
      TSR_ELASTICSEARCH_URL: http://elasticsearch:9200
      TSR_ELASTICSEARCH_PASSWORD: local-only-es
      TSR_CONTENT_DIR: /var/tsr/content
      TSR_YOUTUBE_CHANNEL_ID: ""
  workers:
    environment:
      TSR_WORKERS: search-feed,content-refresh
      TSR_CONTENT_DIR: /var/tsr/content
      TSR_YOUTUBE_CHANNEL_ID: ""
