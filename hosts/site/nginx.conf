# The configuration of the site's server (hosts/site/Dockerfile.server copies it to /etc/nginx/conf.d/default.conf).
# It serves the generated pages from /usr/share/nginx/html and forwards nothing: no proxy, no backend, no host name.
# Besides the pages it answers the addresses of the old website with a redirect (table in docs/deployment.md).
# A slug is letters, digits, "_" and "-": a captured value is never written into a header unless it has only those.

server {
    listen 80;
    # The server's own trailing-slash redirect (/about to /about/) is relative, never "http://host/about/".
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    # The old-article lookup below is itself an error page; without this its own 404 would be the server's stock page, not the site's.
    recursive_error_pages on;

    # The file has no extension, so the stock type table gives it none; the phone's link check needs JSON.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    location ~ ^/tag/(?<slug>[A-Za-z0-9_-]+)/?$ {
        return 301 /articles/?tag=$slug;
    }

    location ~ ^/category/(?<slug>[A-Za-z0-9_-]+)/?$ {
        return 301 /articles/?category=$slug;
    }

    # /YYYY/MM/DD/<slug> and /YYYY/MM/<slug>
    location ~ ^/[0-9][0-9][0-9][0-9]/[0-9][0-9]/[0-9][0-9]/(?<slug>[A-Za-z0-9_-]+)/?$ {
        return 301 /articles/$slug/;
    }

    location ~ ^/[0-9][0-9][0-9][0-9]/[0-9][0-9]/(?<slug>[A-Za-z0-9_-]+)/?$ {
        return 301 /articles/$slug/;
    }

    # The feed has no replacement, so this one is temporary.
    location = /feed {
        return 302 /articles/;
    }

    location ^~ /feed/ {
        return 302 /articles/;
    }

    location ^~ /author/ {
        return 301 /articles/;
    }

    location ~ ^/page/[0-9]+/?$ {
        return 301 /articles/;
    }

    location = /home {
        return 301 /;
    }

    location = /home/ {
        return 301 /;
    }

    location = /articles/importance-reality-awaiting-intezaar-imam-mahdi {
        return 301 /articles/importance-virtue-awaiting-intezaar-imam-mahdi/;
    }

    location = /articles/importance-reality-awaiting-intezaar-imam-mahdi/ {
        return 301 /articles/importance-virtue-awaiting-intezaar-imam-mahdi/;
    }

    # An article address of the old website had no /articles/ in front. A file or folder of the site wins (a folder without its
    # slash gets the server's own redirect); only an unknown one-part address is looked up as an article.
    location ~ ^/(?<slug>[A-Za-z0-9_-]+)/?$ {
        error_page 404 = @legacy_article;
    }

    location @legacy_article {
        if (-f $document_root/articles/$slug/index.html) {
            return 301 /articles/$slug/;
        }
        return 404;
    }

}
