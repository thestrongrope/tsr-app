    location = /reports/subject-conduction { proxy_pass http://new_api; }   # classes
    location = /reports/subject-conduction/download { proxy_pass http://new_api; proxy_read_timeout 70s; }   # classes
    location = /reports/class-sessions { proxy_pass http://new_api; }   # classes
