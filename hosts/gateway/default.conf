    location ~ ^/classes/[^/]+/mcq/standard$ { proxy_pass http://new_api; }   # assessment
    location ~ ^/classes/[^/]+/mcq/standard/[^/]+/copy$ { proxy_pass http://new_api; }   # assessment
    location = /mcq/copy/classes { proxy_pass http://new_api; }   # assessment
    location ~ ^/mcq/copy/classes/[^/]+/topics$ { proxy_pass http://new_api; }   # assessment
    location ~ ^/mcq/copy/classes/[^/]+/quizzes$ { proxy_pass http://new_api; }   # assessment
    location ~ ^/mcq/manage/[^/]+/scores$ { proxy_pass http://new_api; }   # assessment
    location ~ ^/mcq/manage/[^/]+/offline$ { proxy_pass http://new_api; }   # assessment
    location ~ ^/mcq/manage/[^/]+/sheet$ { proxy_pass http://new_api; }   # assessment
    location ~ ^/mcq/manage/[^/]+$ { proxy_pass http://new_api; }   # assessment
    location ~ ^/mcq/manage/[^/]+/publish$ { proxy_pass http://new_api; }   # assessment
    location ~ ^/mcq/manage/[^/]+/deactivate$ { proxy_pass http://new_api; }   # assessment
    location ~ ^/mcq/manage/[^/]+/copy$ { proxy_pass http://new_api; }   # assessment
    location ~ ^/classes/[^/]+$ { proxy_pass http://new_api; }   # classes
    location ~ ^/classes/[^/]+/manage$ { proxy_pass http://new_api; }   # classes
    location ~ ^/classes/[^/]+/students$ { proxy_pass http://new_api; }   # classes
    location ~ ^/classes/[^/]+/students/performance$ { proxy_pass http://new_api; }   # classes
    location ~ ^/classes/[^/]+/teachers$ { proxy_pass http://new_api; }   # classes
    location ~ ^/classes/[^/]+/schedule$ { proxy_pass http://new_api; }   # classes
