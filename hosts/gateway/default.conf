# The gateway for api.: one route table, reviewed in PRs. Every path goes to legacy/php by
# default; a path moved to the new API gets its own location block (one slice = one block).
# In this sample there is no legacy/php, so unmoved paths answer 404 with a clear detail.

upstream new_api {
    server api:8080;
}

server {
    listen 8080;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Gateway's own liveness, for the container healthcheck.
    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Moved to the new API (hosts/api) ---------------------------------
    location = /health   { proxy_pass http://new_api; }   # platform/health
    location = /feedback { proxy_pass http://new_api; }   # platform/submit-feedback
    location = /app-version { proxy_pass http://new_api; }   # platform/app-version (public)
    location = /release-notes { proxy_pass http://new_api; }   # platform/release-notes (public)
    location = /geo/countries { proxy_pass http://new_api; }   # platform/geo-countries (signed in, rate limited)
    location = /geo/postal { proxy_pass http://new_api; }   # platform/geo-postal
    location = /geo/cities { proxy_pass http://new_api; }   # platform/geo-cities
    location = /articles { proxy_pass http://new_api; }   # content/list-published-articles (new path)
    location = /auth/link { proxy_pass http://new_api; }   # identity/link-account (partial `me`: identity fields only)
    location = /me/permissions { proxy_pass http://new_api; }   # access/me-permissions
    location ^~ /me/permissions/ { proxy_pass http://new_api; }   # access/me-permission (one action; the colon may arrive as %3A)
    location = /user/permissions { proxy_pass http://new_api; }   # access/user-permissions (legacy page list by role id)

    # --- Everything else: legacy/php ----------------------------------------
    location / {
        default_type application/json;
        return 404 '{"detail":"Not moved yet: this path is served by legacy/php (tsr-account)"}';
    }
}
