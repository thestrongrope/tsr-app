# The gateway for api.: one route table, reviewed in PRs. Every path goes to legacy/php by
# default; a path moved to the new API gets its own location block (one slice = one block). Every path of
# docs/specs/initial-build/operations.csv goes to the new API (built, or a 501 placeholder).
# In this sample there is no legacy/php, so unmoved paths answer 404 with a clear detail.

upstream new_api {
    server api:8080;
}

server {
    listen 8080;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    # A report download waits 70s: a PDF may take the renderer its full 60 s (domains/platform, PlatformModule), and the API's own answer must arrive before this gives up.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Gateway's own liveness, for the container healthcheck.
    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Moved to the new API (hosts/api) ---------------------------------
    location = /health   { proxy_pass http://new_api; }   # platform/health
    location = /feedback { proxy_pass http://new_api; }   # platform/submit-feedback
    location = /app-version { proxy_pass http://new_api; }   # platform/app-version (public)
    location = /release-notes { proxy_pass http://new_api; }   # platform/release-notes (public)
    location = /geo/countries { proxy_pass http://new_api; }   # platform/geo-countries (signed in, rate limited)
    location = /geo/postal { proxy_pass http://new_api; }   # platform/geo-postal
    location = /geo/cities { proxy_pass http://new_api; }   # platform/geo-cities
    location = /articles { proxy_pass http://new_api; }   # content/list-published-articles (new path)
    location = /quiz/info { proxy_pass http://new_api; }   # assessment/quiz-info (public; a bearer is optional; the app's home banner)
    location = /auth/link { proxy_pass http://new_api; }   # membership/link-account (sign-in is identity's middleware; `me` is the profile)
    location = /me/permissions { proxy_pass http://new_api; }   # access/me-permissions
    location ^~ /me/permissions/ { proxy_pass http://new_api; }   # access/me-permission (one action; the colon may arrive as %3A)
    location = /user/permissions { proxy_pass http://new_api; }   # access/user-permissions (legacy page list by role id)
    location = /me { proxy_pass http://new_api; }   # membership/profile-get, profile-update
    location = /registration { proxy_pass http://new_api; }   # membership/registration-get, registration-save
    location = /me/children/links { proxy_pass http://new_api; }   # membership/children-links
    location ^~ /me/children/link/ { proxy_pass http://new_api; }   # membership/children-link-inspect, children-link-accept (the code is one segment)
    location ~ ^/me/children/[^/]+/link$ { proxy_pass http://new_api; }   # membership/children-link-revoke (GET /me/children and .../classes stay on PHP)
    location = /me/parents { proxy_pass http://new_api; }   # membership/parents-list
    location ^~ /me/parents/ { proxy_pass http://new_api; }   # membership/parent-revoke

    # --- Planned: routed to the new API, which answers 501 until the slice is built ----------
    # One block per path, from docs/specs/initial-build/operations.csv. A slice that is built keeps its block
    # (the path stays routed) and moves the line up to the section above.
    location = /auth/debug-token { proxy_pass http://new_api; }   # identity
    location = /me/deletion-request { proxy_pass http://new_api; }   # identity
    location = /me/children { proxy_pass http://new_api; }   # membership
    location ~ ^/members/[^/]+/parent-links$ { proxy_pass http://new_api; }   # membership
    location ~ ^/members/[^/]+/parent-links/[^/]+$ { proxy_pass http://new_api; }   # membership
    location ~ ^/members/[^/]+/parents/candidate/[^/]+$ { proxy_pass http://new_api; }   # membership
    location ~ ^/members/[^/]+/parents$ { proxy_pass http://new_api; }   # membership
    location ~ ^/me/children/[^/]+/classes$ { proxy_pass http://new_api; }   # classes
    location ~ ^/me/children/[^/]+/classes/[^/]+/attendance$ { proxy_pass http://new_api; }   # classes
    location ~ ^/me/children/[^/]+/classes/[^/]+/performance$ { proxy_pass http://new_api; }   # classes
    location ~ ^/me/children/[^/]+/classes/[^/]+/scores$ { proxy_pass http://new_api; }   # assessment
    location = /devices { proxy_pass http://new_api; }   # notifications
    location = /class-levels { proxy_pass http://new_api; }   # classes
    location = /classes { proxy_pass http://new_api; }   # classes
    location = /classes/join { proxy_pass http://new_api; }   # classes
    location ~ ^/join/[^/]+$ { proxy_pass http://new_api; }   # classes
    location = /classes/create-options { proxy_pass http://new_api; }   # classes
    location = /classes/teachers { proxy_pass http://new_api; }   # classes
    location ~ ^/classes/[^/]+/sessions$ { proxy_pass http://new_api; }   # classes
    location ~ ^/classes/[^/]+/syllabus-topics$ { proxy_pass http://new_api; }   # classes
    location ~ ^/classes/[^/]+/guide$ { proxy_pass http://new_api; }   # classes
    location = /guides { proxy_pass http://new_api; }   # classes
    location ~ ^/guides/[^/]+$ { proxy_pass http://new_api; }   # classes
    location = /me/guides { proxy_pass http://new_api; }   # classes
    location ~ ^/me/guides/[^/]+$ { proxy_pass http://new_api; }   # classes
    location ~ ^/classes/[^/]+/my-attendance$ { proxy_pass http://new_api; }   # classes
    location ~ ^/classes/[^/]+/my-performance$ { proxy_pass http://new_api; }   # classes
    location ~ ^/classes/[^/]+/notifications$ { proxy_pass http://new_api; proxy_read_timeout 130s; }   # notifications (pushes synchronously: the push batch has a 120 s deadline; the default is 30 s)
    location ~ ^/classes/[^/]+/notifications/scheduled$ { proxy_pass http://new_api; }   # notifications
    location ~ ^/classes/[^/]+/notifications/scheduled/[^/]+$ { proxy_pass http://new_api; }   # notifications
    location = /me/calendar { proxy_pass http://new_api; }   # notifications
    location = /me/calendar/settings { proxy_pass http://new_api; }   # notifications
    location ~ ^/classes/[^/]+/scheduled-events$ { proxy_pass http://new_api; }   # notifications
    location ~ ^/classes/[^/]+/scheduled-events/[^/]+$ { proxy_pass http://new_api; }   # notifications
    location = /holy-quran { proxy_pass http://new_api; }   # content
    location = /api/v1/articles { proxy_pass http://new_api; }   # content/v1-articles (public; the path and answer shape of today's website)
    location ~ ^/api/v1/articles/[^/]+$ { proxy_pass http://new_api; }   # content/v1-article (public)
    location = /api/v1/taxonomies/categories { proxy_pass http://new_api; }   # content/v1-categories (public)
    location = /api/v1/taxonomies/tags { proxy_pass http://new_api; }   # content/v1-tags (public)
    location = /api/v1/publications { proxy_pass http://new_api; }   # content/v1-publications (public)
    location = /api/v1/youtube { proxy_pass http://new_api; }   # content/v1-videos (public; the latest videos)
    location ~ ^/classes/[^/]+/conduction$ { proxy_pass http://new_api; }   # classes
    location ~ ^/classes/[^/]+/conduction/new$ { proxy_pass http://new_api; }   # classes
    location ~ ^/classes/[^/]+/conduction/check$ { proxy_pass http://new_api; }   # classes
