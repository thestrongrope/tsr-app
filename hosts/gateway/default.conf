    location ~ ^/registrations/[^/]+/classes$ { proxy_pass http://new_api; }   # classes
    location ~ ^/registrations/[^/]+/place$ { proxy_pass http://new_api; }   # classes
    location ~ ^/registrations/[^/]+/reject$ { proxy_pass http://new_api; }   # membership
