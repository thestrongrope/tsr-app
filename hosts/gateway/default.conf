    location = /reports/mcq-adherence/download-all { proxy_pass http://new_api; proxy_read_timeout 70s; }   # classes
    location ~ ^/reports/mcq-adherence/[^/]+$ { proxy_pass http://new_api; }   # classes
    location ~ ^/reports/mcq-adherence/[^/]+/download$ { proxy_pass http://new_api; proxy_read_timeout 70s; }   # classes
