# The configuration of the web app's server (hosts/app/Dockerfile copies it to /etc/nginx/conf.d/default.conf).
# It serves the built Flutter Web files and forwards nothing: the browser calls the API itself, at the address compiled into the app.

server {
    listen 80;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # The app routes after the "#", so every page is index.html; an address that is not a file answers with it too, not a stock 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # These name the files of the current build, so a browser must ask for them every time; the rest may be cached as usual.
    location ~ ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-cache";
    }
}
