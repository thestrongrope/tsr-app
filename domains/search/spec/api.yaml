openapi: 3.1.0
info:
  title: TSR search
  version: 0.1.0
  description: |
    The search domain's one action. Forward compatible: a store-live app keeps calling it, so add fields freely but never remove or
    change one without the release process. Every error body is {"detail": "..."}, with one named exception: the two public paths under /api/v1/
    (article search and lecture search) keep the website's answer shape, {success, data, meta, pagination}, and its failure shape,
    {"success": false, "error": {"code", "message"}, "meta"} (root CLAUDE.md rule 7), because supported app builds read it.
servers:
  - url: https://gateway.tsr-app-dev.orb.local
    description: Local dev stack (gateway)
paths:
  /search:
    get:
      operationId: search
      summary: Search classes, teachers, guides, students and subscribers within the caller's reach
      description: |
        A first sign-in creates the member's row (PHP's api_authenticate(true)). Guards in order: sign-in (401), the stored gender is
        numeric (400 "User gender not set; update profile first"), permission classes:read (403), then q and kinds (422).
        Each kind the caller has a way in to comes back as a group of up to 50 results, `capped` when the limit was reached; a kind
        with no way in has no group. A kind the index cannot answer (Elasticsearch down or not configured) is listed in `unavailable`,
        never as an empty group. Results are limited to the caller's reach inside the index query and checked again against the database.
        Slice: features/search/Search.cs.
      security:
        - memberToken: []
      parameters:
        - name: q
          in: query
          required: true
          description: The words to look for (every word must match a name prefix). Trimmed; 2 to 100 characters; no NUL.
          schema: {type: string}
        - name: kinds
          in: query
          required: false
          description: A comma list of class, teacher, guide, student, subscriber; all when omitted. Answered in the order given.
          schema: {type: string}
      responses:
        "200":
          description: The groups and the kinds that could not be searched
          content:
            application/json:
              schema:
                type: object
                required: [groups, unavailable]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/Group"
                  unavailable:
                    type: array
                    items: {type: string}
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/search:
    get:
      operationId: v1Search
      summary: Search the published articles (the website's route, kept as it is)
      description: |
        Public, no sign-in. Answers in the website's shape. The rate limit (60 requests a minute per client) runs first, then q. Elasticsearch answers when it is
        configured and working (searchEngine "elasticsearch"); otherwise the published articles in the database do (searchEngine "fuse"). pagination.total is the
        number of results on this page and hasMore is true exactly when it equals limit. A 200 sends Cache-Control public, max-age=60, an ETag and Vary, and is never a 304.
        Slice: features/v1-search/V1Search.cs.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          description: The words to look for. Trimmed; missing or blank is a 400; more than 200 characters is a 400.
          schema: {type: string}
        - name: limit
          in: query
          required: false
          description: 20 by default, kept between 1 and 100; a value that is not a number gives the default.
          schema: {type: string}
        - name: offset
          in: query
          required: false
          description: 0 by default, never below 0; a value that is not a number gives the default. offset plus limit above 10000 (Elasticsearch's result window) is a 400.
          schema: {type: string}
        - name: category
          in: query
          required: false
          description: One category, used as written; only articles in it are returned.
          schema: {type: string}
        - name: fields
          in: query
          required: false
          description: Accepted and ignored.
          schema: {type: string}
      responses:
        "200":
          description: The matching articles, best match first
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta, pagination]
                properties:
                  success: {type: boolean, enum: [true]}
                  data:
                    type: object
                    required: [results, query, searchEngine, took]
                    properties:
                      results:
                        type: array
                        items:
                          type: object
                          required: [id, slug, title, publishedDate, author, categories, tags, language, readingTime, score]
                          properties:
                            id: {type: integer, description: "Always 0 from the engine; the legacy id (or 0) from the database"}
                            slug: {type: string}
                            title: {type: string}
                            excerpt: {type: string}
                            publishedDate: {type: string}
                            modifiedDate: {type: string}
                            author: {type: string}
                            categories: {type: array, items: {type: string}}
                            tags: {type: array, items: {type: string}}
                            language: {type: string}
                            readingTime: {type: integer}
                            score: {type: number}
                            highlights: {type: object, description: "title, excerpt and content snippets with <em> around the match"}
                      query: {type: string}
                      searchEngine: {type: string, enum: [elasticsearch, fuse]}
                      took: {type: integer, description: Milliseconds}
                  meta: {type: object}
                  pagination:
                    type: object
                    required: [total, limit, offset, hasMore]
                    properties:
                      total: {type: integer}
                      limit: {type: integer}
                      offset: {type: integer}
                      hasMore: {type: boolean}
        "400":
          description: q is missing or blank, longer than 200 characters, or offset plus limit is above 10000. {"success": false, "error": {"code": "VALIDATION_ERROR", "message": "Missing required parameter: q"}, "meta": {...}}
        "429":
          description: More than 60 requests in a minute from one client. {"success": false, "error": "Too many requests"} with Retry-After, X-RateLimit-Limit and X-RateLimit-Remaining 0.
        "500":
          description: An unexpected failure. {"success": false, "error": {"code": "INTERNAL_ERROR", "message": "An unexpected error occurred"}, "meta": {...}}
components:
  securitySchemes:
    memberToken:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  responses:
    Problem:
      description: |
        An error. The body is always {"detail": "..."}
      content:
        application/json:
          schema:
            type: object
            required: [detail]
            properties:
              detail:
                type: string
  schemas:
    Group:
      type: object
      required: [kind, count, capped, results]
      properties:
        kind: {type: string, enum: [class, teacher, guide, student, subscriber]}
        count: {type: integer}
        capped: {type: boolean}
        results:
          type: array
          items:
            $ref: "#/components/schemas/Result"
    Result:
      type: object
      description: |
        id is the class id (class, guide: the class of the guide's level the caller reaches) or the member's token (teacher, student, subscriber).
        title is "(unnamed)" when empty; subtitle is the level (class), "Teacher", the student's reached class codes, or empty.
      required: [id, title, subtitle]
      properties:
        id: {type: integer}
        title: {type: string}
        subtitle: {type: string}
