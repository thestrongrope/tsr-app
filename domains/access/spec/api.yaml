openapi: 3.1.0
info:
  title: TSR access
  version: 0.1.0
  description: |
    The access domain's routes: what the signed-in member may do. Words: glossary.md. Behaviour: tests/
    (run against any base URL, on PHP and on the new API alike). Forward compatible: add fields freely, never remove
    or change one without the release process. Every error body is {"detail": "..."}.
    The three /me routes need a sign-in and no permission (a member sees their own answer); the /admin routes need permissions:manage or class-access:manage.
    Every response of a request whose sign-in passed, on these routes and on every other domain's, carries the header
    X-Permissions-Revision (components.headers.PermissionsRevision): success, 304, a download and the route's own refusals alike.
    A request refused at sign-in (401, and the 403 and 404 of the sign-in itself) and a route without sign-in carry none.
servers:
  - url: https://gateway.tsr-app-dev.orb.local
    description: Local dev stack (gateway)
paths:
  /me/permissions:
    get:
      operationId: getMePermissions
      summary: Everything the caller may do, what their scopes resolve to, the two navigation facts and the revision
      description: |
        The answer's `revision` is also its ETag. A client that saved an answer asks again with `If-None-Match` and gets
        304 with no body while nothing changed. The revision changes when, and only when, the permissions, the scopes,
        the navigation or the version change; `issued_at` is not part of it. Its value equals PHP's for the same answer.
      security:
        - memberToken: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
          description: 'One or more tags separated by commas, each strong ("x") or weak (W/"x"), or *. Weak comparison.'
      responses:
        "200":
          description: Permission names in catalog order (ordinal), the scopes, navigation and revision
          headers:
            ETag: { schema: { type: string }, description: 'The revision in double quotes, e.g. "0123456789abcdef"' }
            X-Permissions-Revision: { $ref: "#/components/headers/PermissionsRevision" }
            Cache-Control: { schema: { type: string, const: "private, no-cache" } }
            Vary: { schema: { type: string }, description: Names Authorization }
          content:
            application/json:
              schema:
                type: object
                required: [version, issued_at, permissions, scopes, navigation, revision]
                properties:
                  version: { type: integer, const: 5 }
                  issued_at: { type: string, description: "UTC, microseconds, +00:00 offset" }
                  permissions: { type: array, items: { type: string } }
                  scopes:
                    type: object
                    required: [gender, assigned, assigned_genders, own, taught, enrolled]
                    properties:
                      gender: { type: [integer, "null"], description: "1 gents, 2 ladies, from the role; null otherwise" }
                      assigned: { type: array, items: { type: integer } }
                      assigned_genders: { type: array, items: { type: integer } }
                      own: { type: array, items: { type: integer } }
                      taught: { type: array, items: { type: integer } }
                      enrolled: { type: array, items: { type: integer } }
                  navigation:
                    type: object
                    required: [classes, manage]
                    properties:
                      classes: { type: boolean, description: "A class attended, taught, owned or assigned, or classes:read for a gender or every class" }
                      manage: { type: boolean, description: "Holds a permission that has a module in the admin dashboard" }
                  revision: { type: string, pattern: "^[0-9a-f]{16}$", description: "Fingerprint of version, permissions, scopes and navigation" }
        "304":
          description: If-None-Match names the current tag; no body, the same ETag, Cache-Control and Vary
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/PermissionsUnavailable" }
  /me/permissions/{permission}:
    get:
      operationId: getMePermission
      summary: The scopes the caller holds one action in
      description: "`permission` is resource:action (no scope); the colon may be percent-encoded. Empty scopes means not held."
      security:
        - memberToken: []
      parameters:
        - { name: permission, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The scopes, in catalog order
          content:
            application/json:
              schema:
                type: object
                required: [permission, scopes]
                properties:
                  permission: { type: string }
                  scopes: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /user/permissions:
    get:
      operationId: getUserPermissions
      summary: The older page list by role id (the app's router reads it)
      description: |
        Legacy, copied from PHP including a bug: the two derived roles (class_admin, class_teacher) are listed in
        applicable_roles but grant no pages.
      security:
        - memberToken: []
      responses:
        "200":
          description: Role, pages and class facts
          content:
            application/json:
              schema:
                type: object
                required: [version, permissions, role_id, role_name, applicable_roles, enrolled, class_count, teacher_count, mcq_admin, is_teacher, issued_at]
                properties:
                  version: { type: integer, const: 3 }
                  permissions: { type: array, items: { type: string } }
                  role_id: { type: integer }
                  role_name: { type: string }
                  applicable_roles:
                    type: array
                    items:
                      type: object
                      required: [role_id, role_name, source, priority]
                      properties:
                        role_id: { type: [integer, string] }
                        role_name: { type: string }
                        source: { type: string }
                        priority: { type: integer }
                  enrolled: { type: boolean }
                  class_count: { type: integer }
                  teacher_count: { type: integer }
                  mcq_admin: { type: boolean }
                  is_teacher: { type: boolean }
                  issued_at: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /admin/permissions/members:
    get:
      operationId: searchPermissionMembers
      summary: Members by name, token, email or mobile (at most 20; name and token come back)
      description: Needs permissions:manage (super admin). `q` under two characters finds nobody.
      security:
        - memberToken: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The matches, by name then token
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      required: [token, name]
                      properties:
                        token: { type: integer }
                        name: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /admin/permissions/members/{token}:
    get:
      operationId: getPermissionMember
      summary: What a member holds (from the role, by grant) and what may still be granted
      description: Needs permissions:manage. Unknown member or token 0 is 404.
      security:
        - memberToken: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/PermissionMember" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/PermissionsUnavailable" }
  /admin/permissions/members/{token}/grants:
    post:
      operationId: grantPermission
      summary: Give a member a named permission
      description: |
        Needs permissions:manage. Only catalog permissions of scope `all` are grantable, never permissions:manage:all,
        class-access:manage:all or members:enrol-by-token:all. 409 when the member already holds it, 422 when it cannot be granted, and 422 when the member is the operator themself
        (`You cannot grant a permission to yourself`; stricter than PHP, new API only).
      security:
        - memberToken: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission, reason]
              properties:
                permission: { type: string }
                reason: { type: string, maxLength: 300 }
      responses:
        "200": { $ref: "#/components/responses/PermissionMember" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/PermissionsUnavailable" }
  /admin/permissions/grants/{id}/revoke:
    post:
      operationId: revokePermissionGrant
      summary: Revoke a named grant (the row stays, with who, when and why)
      description: Needs permissions:manage. 404 unknown grant, 409 already revoked.
      security:
        - memberToken: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        "200": { $ref: "#/components/responses/PermissionMember" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/PermissionsUnavailable" }
  /admin/class-access/members:
    get:
      operationId: searchClassAccessMembers
      summary: Members by name or token, of the genders the operator manages (at most 20)
      description: Needs class-access:manage (super admin: both genders; gender admin: their own). `q` under two characters finds nobody; at most 100 characters are used.
      security:
        - memberToken: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The matches, by name then token; contact details are never sent
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      required: [token, name, gender]
                      properties:
                        token: { type: integer }
                        name: { type: string }
                        gender: { type: integer, description: "1 gents, 2 ladies" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /admin/class-access/members/{token}:
    get:
      operationId: getClassAccessMember
      summary: A member's live class access rules, each with the classes it reaches
      description: |
        Needs class-access:manage. 404 unknown member; 403 when the member's gender is not one the operator manages (also when none is recorded).
        Only rules whose gender the operator manages are listed, but `version` covers every live rule.
      security:
        - memberToken: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/ClassAccessMember" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/class-access/options:
    get:
      operationId: getClassAccessOptions
      summary: What a rule can be built from
      description: Needs class-access:manage. Genders the operator manages; all levels; the cities, countries and tags of the active classes of those genders (sorted, at most 500 each).
      security:
        - memberToken: []
      responses:
        "200":
          description: The options
          content:
            application/json:
              schema:
                type: object
                required: [genders, levels, cities, countries, tags]
                properties:
                  genders:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: integer }
                        name: { type: string }
                  levels:
                    type: array
                    items:
                      type: object
                      required: [id, code, name]
                      properties:
                        id: { type: integer }
                        code: { type: string }
                        name: { type: string }
                  cities: { type: array, items: { type: string } }
                  countries: { type: array, items: { type: string } }
                  tags: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /admin/class-access/preview:
    post:
      operationId: previewClassAccess
      summary: The active classes a draft rule would reach (writes nothing)
      description: |
        Needs class-access:manage. `gender` 1 or 2, or left out for either (needs both genders). Conditions are IN only; each city, country and tag must be one the operator is offered;
        a level must exist. At most 200 classes are listed; `classCount` and `previewHash` cover all of them.
      security:
        - memberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassAccessDraft" }
      responses:
        "200":
          description: The classes, how many, and the hash a grant must echo back
          content:
            application/json:
              schema:
                type: object
                required: [classes, classCount, previewHash]
                properties:
                  classes:
                    type: array
                    items:
                      type: object
                      required: [id, code, name]
                      properties:
                        id: { type: integer }
                        code: { type: string }
                        name: { type: string }
                  classCount: { type: integer }
                  previewHash: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /admin/class-access/members/{token}/rules:
    post:
      operationId: grantClassAccess
      summary: Give a member a class access rule
      description: |
        Needs class-access:manage. The operator cannot change their own access, and needs the rule's gender and the member's gender (a rule of either gender needs both: super admin only).
        Stricter than PHP (new API only): 403 when the operator is not a super admin and the member is a super admin or a gender admin.
        `version` is the one the member view gave; `previewHash` the one the preview gave. 409 with `code` member_changed (someone else changed the member), already_has_access,
        or preview_changed (the body then lists the classes now reached, `classCount` and the new `previewHash`). 422: no reason, no condition, a Finance member, own access, a rule that reaches no class.
        A member with no role becomes a class admin (role 5).
      security:
        - memberToken: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/ClassAccessDraft" }
                - type: object
                  required: [reason, version, previewHash]
                  properties:
                    reason: { type: string, maxLength: 300 }
                    version: { type: string }
                    previewHash: { type: string }
      responses:
        "200": { $ref: "#/components/responses/ClassAccessSaved" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /admin/class-access/rules/{id}/revoke:
    post:
      operationId: revokeClassAccess
      summary: Remove a class access rule (it stays, with who, when and why)
      description: |
        Needs class-access:manage, the rule's gender and the member's gender; never the operator's own access. Stricter than PHP (new API only): 403 unless the operator granted the rule or is a super admin, and 403 when the operator is not a super admin and the member is a super admin or a gender admin. 404 unknown rule, 409 already removed or `code` member_changed.
        A class admin whose last live rule this was returns to no role.
      security:
        - memberToken: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, version]
              properties:
                reason: { type: string, maxLength: 300 }
                version: { type: string }
      responses:
        "200": { $ref: "#/components/responses/ClassAccessSaved" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
components:
  headers:
    PermissionsRevision:
      description: |
        The signed-in member's permissions revision (the `revision` of GET /me/permissions) as it was before the route ran.
        Left out when the permissions could not be loaded.
      schema: { type: string, pattern: "^[0-9a-f]{16}$" }
  securitySchemes:
    memberToken:
      type: http
      scheme: bearer
      description: A Firebase ID token (identity verifies it)
  responses:
    Problem:
      description: "{\"detail\": \"...\"}; 403 may add deletion_status"
      content:
        application/json:
          schema:
            type: object
            required: [detail]
            properties:
              detail: { type: string }
    PermissionsUnavailable:
      description: 'The member''s permissions could not be loaded: {"detail": "Permissions could not be loaded. Try again."}. Never an empty answer; no ETag.'
      content:
        application/json:
          schema:
            type: object
            required: [detail]
            properties:
              detail: { type: string }
    PermissionMember:
      description: The member, what the role gives, the live named grants, and what may still be granted
      content:
        application/json:
          schema:
            type: object
            required: [member, fromRole, granted, grantable]
            properties:
              member:
                type: object
                required: [token, name]
                properties:
                  token: { type: integer }
                  name: { type: string }
              fromRole:
                type: array
                items: { $ref: "#/components/schemas/PermissionInfo" }
              granted:
                type: array
                items:
                  allOf:
                    - { $ref: "#/components/schemas/PermissionInfo" }
                    - type: object
                      required: [id, grantedAt]
                      properties:
                        id: { type: integer }
                        reason: { type: [string, "null"] }
                        grantedBy: { type: [string, "null"] }
                        grantedAt: { type: string }
              grantable:
                type: array
                items: { $ref: "#/components/schemas/PermissionInfo" }
    ClassAccessMember:
      description: The member, the version to echo on a write, what the role already reaches, and the live rules the operator manages
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ClassAccessView" }
    ClassAccessSaved:
      description: "`saved` is true, and the refreshed member view. When the view could not be read after the commit, member and version are null and rules empty: the app reloads."
      content:
        application/json:
          schema:
            allOf:
              - type: object
                required: [saved]
                properties:
                  saved: { type: boolean }
              - { $ref: "#/components/schemas/ClassAccessView" }
  schemas:
    ClassAccessDraft:
      type: object
      required: [conditions]
      properties:
        gender: { type: [integer, "null"], description: "1 or 2; left out for either" }
        conditions:
          type: array
          items:
            type: object
            required: [field, value]
            properties:
              field: { type: string, enum: [city, country, level, tag] }
              negate: { type: boolean, description: "Only false can be added" }
              value: { type: [string, integer], description: "A level id for level, text otherwise" }
    ClassAccessView:
      type: object
      required: [member, version, fromRole, rules]
      properties:
        member:
          type: object
          required: [token, name, gender]
          properties:
            token: { type: integer }
            name: { type: string }
            gender: { type: integer }
        version: { type: string }
        fromRole: { type: [string, "null"] }
        rules:
          type: array
          items:
            type: object
            required: [id, gender, note, createdAt, conditions, classCount, classes]
            properties:
              id: { type: integer }
              gender: { type: [integer, "null"] }
              note: { type: string }
              createdAt: { type: string }
              conditions:
                type: array
                items:
                  type: object
                  required: [field, negate, value]
                  properties:
                    field: { type: string }
                    negate: { type: boolean }
                    value: { type: [string, integer, "null"] }
              classCount: { type: integer }
              classes:
                type: array
                items:
                  type: object
                  required: [id, code, name, ruleId, rule]
                  properties:
                    id: { type: integer }
                    code: { type: string }
                    name: { type: string }
                    ruleId: { type: integer }
                    rule: { type: string }
    PermissionInfo:
      type: object
      required: [name, description, reach]
      properties:
        name: { type: string }
        description: { type: string }
        reach: { type: string }
