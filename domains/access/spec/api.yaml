openapi: 3.1.0
info:
  title: TSR access
  version: 0.1.0
  description: |
    The access domain's routes: what the signed-in member may do. Words: glossary.md. Behaviour: tests/
    (run against any base URL, on PHP and on the new API alike). Forward compatible: add fields freely, never remove
    or change one without the release process. Every error body is {"detail": "..."}.
    All three routes need a sign-in and no permission (a member sees their own answer).
servers:
  - url: http://localhost:8088
    description: Local dev stack (gateway)
paths:
  /me/permissions:
    get:
      operationId: getMePermissions
      summary: Everything the caller may do, and what their scopes resolve to
      security:
        - memberToken: []
      responses:
        "200":
          description: Permission names in catalog order (ordinal), and the scopes
          content:
            application/json:
              schema:
                type: object
                required: [version, issued_at, permissions, scopes]
                properties:
                  version: { type: integer, const: 4 }
                  issued_at: { type: string, description: "UTC, microseconds, +00:00 offset" }
                  permissions: { type: array, items: { type: string } }
                  scopes:
                    type: object
                    required: [gender, assigned, assigned_genders, own, taught, enrolled]
                    properties:
                      gender: { type: [integer, "null"], description: "1 gents, 2 ladies, from the role; null otherwise" }
                      assigned: { type: array, items: { type: integer } }
                      assigned_genders: { type: array, items: { type: integer } }
                      own: { type: array, items: { type: integer } }
                      taught: { type: array, items: { type: integer } }
                      enrolled: { type: array, items: { type: integer } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /me/permissions/{permission}:
    get:
      operationId: getMePermission
      summary: The scopes the caller holds one action in
      description: "`permission` is resource:action (no scope); the colon may be percent-encoded. Empty scopes means not held."
      security:
        - memberToken: []
      parameters:
        - { name: permission, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The scopes, in catalog order
          content:
            application/json:
              schema:
                type: object
                required: [permission, scopes]
                properties:
                  permission: { type: string }
                  scopes: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /user/permissions:
    get:
      operationId: getUserPermissions
      summary: The older page list by role id (the app's router reads it)
      description: |
        Legacy, copied from PHP including a bug: the two derived roles (class_admin, class_teacher) are listed in
        applicable_roles but grant no pages.
      security:
        - memberToken: []
      responses:
        "200":
          description: Role, pages and class facts
          content:
            application/json:
              schema:
                type: object
                required: [version, permissions, role_id, role_name, applicable_roles, enrolled, class_count, teacher_count, mcq_admin, is_teacher, issued_at]
                properties:
                  version: { type: integer, const: 3 }
                  permissions: { type: array, items: { type: string } }
                  role_id: { type: integer }
                  role_name: { type: string }
                  applicable_roles:
                    type: array
                    items:
                      type: object
                      required: [role_id, role_name, source, priority]
                      properties:
                        role_id: { type: [integer, string] }
                        role_name: { type: string }
                        source: { type: string }
                        priority: { type: integer }
                  enrolled: { type: boolean }
                  class_count: { type: integer }
                  teacher_count: { type: integer }
                  mcq_admin: { type: boolean }
                  is_teacher: { type: boolean }
                  issued_at: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /admin/permissions/members:
    get:
      operationId: searchPermissionMembers
      summary: Members by name, token, email or mobile (at most 20; name and token come back)
      description: Needs permissions:manage (super admin). `q` under two characters finds nobody.
      security:
        - memberToken: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The matches, by name then token
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      required: [token, name]
                      properties:
                        token: { type: integer }
                        name: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /admin/permissions/members/{token}:
    get:
      operationId: getPermissionMember
      summary: What a member holds (from the role, by grant) and what may still be granted
      description: Needs permissions:manage. Unknown member or token 0 is 404.
      security:
        - memberToken: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/PermissionMember" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/permissions/members/{token}/grants:
    post:
      operationId: grantPermission
      summary: Give a member a named permission
      description: |
        Needs permissions:manage. Only catalog permissions of scope `all` are grantable, never permissions:manage:all,
        class-access:manage:all or members:enrol-by-token:all. 409 when the member already holds it, 422 when it cannot be granted.
      security:
        - memberToken: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission, reason]
              properties:
                permission: { type: string }
                reason: { type: string, maxLength: 300 }
      responses:
        "200": { $ref: "#/components/responses/PermissionMember" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /admin/permissions/grants/{id}/revoke:
    post:
      operationId: revokePermissionGrant
      summary: Revoke a named grant (the row stays, with who, when and why)
      description: Needs permissions:manage. 404 unknown grant, 409 already revoked.
      security:
        - memberToken: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        "200": { $ref: "#/components/responses/PermissionMember" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    memberToken:
      type: http
      scheme: bearer
      description: A Firebase ID token (identity verifies it)
  responses:
    Problem:
      description: "{\"detail\": \"...\"}; 403 may add deletion_status"
      content:
        application/json:
          schema:
            type: object
            required: [detail]
            properties:
              detail: { type: string }
    PermissionMember:
      description: The member, what the role gives, the live named grants, and what may still be granted
      content:
        application/json:
          schema:
            type: object
            required: [member, fromRole, granted, grantable]
            properties:
              member:
                type: object
                required: [token, name]
                properties:
                  token: { type: integer }
                  name: { type: string }
              fromRole:
                type: array
                items: { $ref: "#/components/schemas/PermissionInfo" }
              granted:
                type: array
                items:
                  allOf:
                    - { $ref: "#/components/schemas/PermissionInfo" }
                    - type: object
                      required: [id, grantedAt]
                      properties:
                        id: { type: integer }
                        reason: { type: [string, "null"] }
                        grantedBy: { type: [string, "null"] }
                        grantedAt: { type: string }
              grantable:
                type: array
                items: { $ref: "#/components/schemas/PermissionInfo" }
  schemas:
    PermissionInfo:
      type: object
      required: [name, description, reach]
      properties:
        name: { type: string }
        description: { type: string }
        reach: { type: string }
