openapi: 3.1.0
info:
  title: TSR classes
  version: 0.1.0
  description: |
    The classes domain's actions. Words: glossary.md (not written yet). Behaviour: tests/ (run against any base URL).
    Forward compatible: a store-live app keeps calling these, so add fields and routes freely but
    never remove or change one without the release process. Every error body is {"detail": "..."}.
servers:
  - url: http://localhost:8088
    description: Local dev stack (gateway)
paths:
  /class-levels:
    get:
      operationId: listClassLevels
      summary: The class levels in display order
      description: |
        Any signed-in member; no permission is checked (as PHP). A first sign-in creates the member's row
        (PHP's api_authenticate(true)). Ordered by sort order then id; the sort order itself is not returned
        (GET /syllabus/levels has it). Slice: features/class-levels/ClassLevels.cs.
      security:
        - memberToken: []
      responses:
        "200":
          description: The levels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassLevel"
        "401":
          $ref: "#/components/responses/Problem"
  /guides:
    get:
      operationId: listGuideLevels
      summary: The class levels that can have a guide
      description: |
        Permission guides:manage (403 "You do not have permission to do that"). Levels 2 to 5 in level order, id and name only.
        Slice: features/guides-list/GuidesList.cs.
      security:
        - memberToken: []
      responses:
        "200":
          description: "{levels: [{id, name}]}"
          content:
            application/json:
              schema:
                type: object
                required: [levels]
                properties:
                  levels:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: {type: integer}
                        name: {type: string}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /guides/{level_id}:
    get:
      operationId: getGuideForEditing
      summary: The English guide of a level, as the editor starts from it
      description: |
        Permission guides:manage. The id is PHP's (int) cast. A level without a guide page (not 2 to 5) is 404 "Level not found". guide is null when no row exists.
        Slice: features/guide-get/GuideGet.cs.
      security:
        - memberToken: []
      parameters:
        - {name: level_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: "{guide: string or null, level_name}"
          content:
            application/json:
              schema:
                type: object
                required: [guide, level_name]
                properties:
                  guide: {type: [string, "null"]}
                  level_name: {type: string}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    put:
      operationId: putGuide
      summary: Replace a level's English guide
      description: |
        Body {guide}. guides:manage (403), the level has a guide page (404), guide non-blank text of at most 65535 bytes (422). Answers {guide}.
        Slice: features/guide-update/GuideUpdate.cs. Event: classes.guide_saved.
      security:
        - memberToken: []
      parameters:
        - {name: level_id, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: The body described above
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /classes:
    get:
      operationId: listMyClasses
      summary: The caller's active classes (taught, attended, and with include=managed the ones their reach covers)
      description: |
        Permission classes:read; no gender needed. Query include=managed, level, language (int casts), q (LIKE on code or name; "0" is empty). Conducting classes first, then newest id first.
        role is conducting, attending or managing; studentCount only for managing; joinUrl is null until the public web base is configured.
        Slice: features/classes-list/ClassesList.cs.
      security:
        - memberToken: []
      responses:
        "200":
          description: The class cards with city, country, tags, studentCount and schedules
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ClassCard"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      operationId: postClass
      summary: Create a class
      description: |
        Body {gender 1|2, levelId, location, city, country, teacher, tags, schedules}. classes:create for the gender (403), 422s, 409 when the same class was made within a minute. 201 {classId}.
        Slice: features/class-create/ClassCreate.cs. Event: classes.class_created.
      security:
        - memberToken: []
      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
        "201":
          description: The body described above
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /classes/{class_id}:
    get:
      operationId: getClass
      summary: One class with its schedule
      description: |
        404 unknown or inactive class; 403 without classes:read on it; a member who is neither the teacher nor covered by their reach needs a numeric gender (400) and must attend the class of their gender.
        Slice: features/class-detail/ClassDetail.cs.
      security:
        - memberToken: []
      parameters:
        - {name: class_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The class card and schedules
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClassCard"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    put:
      operationId: putClass
      summary: Edit a class's details, teacher, tags and schedule
      description: |
        Body {languageId?, startedOn?, format, address?, city?, country?, location?, teacher, tags, schedules}. Active complete class (404), classes:update (403), then 422. Answers with the manage payload.
        Slice: features/class-update/ClassUpdate.cs. Event: classes.class_updated.
      security:
        - memberToken: []
      parameters:
        - {name: class_id, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: The body described above
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /classes/{class_id}/sessions:
    get:
      operationId: listClassSessions
      summary: A class's sessions, newest day first
      description: |
        Gender set (400), active class (404), classes:read on the class (403). Query page, pageSize (default 20, at most 100). A bare array; not-conducted sessions are included.
        Slice: features/class-sessions/ClassSessions.cs.
      security:
        - memberToken: []
      parameters:
        - {name: class_id, in: path, required: true, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, schema: {type: integer}}
      responses:
        "200":
          description: "[{id, conductedOn, conducted, duration, attendance, <five>Conducted, <five>Topic, nonConductionReason}]"
          content:
            application/json:
              schema: {type: array, items: {type: object}}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /classes/{class_id}/conduction:
    get:
      operationId: listClassConduction
      summary: A class's conduction records for the teacher's screen
      description: |
        Active class (404), then sessions:create on it (403 "You do not have permission to manage this class"); no gender check. Query page, pageSize (default 20, at most 100). Newest day first; no deleted filter; totalPages is a float.
        Slice: features/conduction-list/ConductionList.cs.
      security:
        - memberToken: []
      parameters:
        - {name: class_id, in: path, required: true, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, schema: {type: integer}}
      responses:
        "200":
          description: "{class: {id, code, name, level, levelName, gender, status, teacherName, students, extraStudents, totalStudents}, sessions: [session], totalRecords, totalPages, page}"
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    post:
      operationId: recordClassConduction
      summary: Record a class session (201; a repeat of the same request answers 200 with the record it made)
      description: |
        Active class (404), then sessions:create on it (403 "You do not have permission to manage this class"); no gender check. Then the body (422), the payload rules in PHP order, the replay (same class, day, caller and recordedAt), a session already on the day (409).
        Body: conductedOn, conducted (default true), nonConductionReason, duration, quranRecitationSurah, quranRecitationVerse, students [{token, present, recitation}], extraStudents [{name, token, present}], <five>Conducted, <five>Topic, recordedAt. Students who never were in the class are dropped.
        Slice: features/conduction-create/ConductionCreate.cs; the rules in domain/ConductionRules.cs, the write in domain/ConductionWriter.cs. Event classes.session_recorded.
      security:
        - memberToken: []
      parameters:
        - {name: class_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "201":
          description: "the saved session"
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /classes/{class_id}/conduction/new:
    get:
      operationId: getClassConductionForm
      summary: The data of the new-record form
      description: |
        Active class (404), then sessions:create on it (403 "You do not have permission to manage this class"); no gender check.
        lastSessionDate (the newest session, else the class start day), nextSessionDate (schedule rows of every state), futureDate (the next day when after today), latestTopics (newest non-blank per subject among held sessions), latestSurah, holyQuran.
        Slice: features/conduction-new/ConductionNew.cs.
      security:
        - memberToken: []
      parameters:
        - {name: class_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: "{class, lastSessionDate, nextSessionDate, futureDate, latestTopics, latestSurah, holyQuran}"
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /classes/{class_id}/conduction/check:
    get:
      operationId: checkClassConductionDay
      summary: Is there a session on the day, and is its week full
      description: |
        Active class (404), then sessions:create on it (403 "You do not have permission to manage this class"); no gender check. Query date (read as PHP strtotime: Y-m-d with time and offset, YYYYMMDD, d-m-Y, m/d/Y, "20 September 2025", today, tomorrow, yesterday); missing or unreadable is 422.
        Slice: features/conduction-check/ConductionCheck.cs.
      security:
        - memberToken: []
      parameters:
        - {name: class_id, in: path, required: true, schema: {type: string}}
        - {name: date, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: "{alreadyConducted, sameWeek}"
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /classes/{class_id}/conduction/{session_id}:
    get:
      operationId: getClassConduction
      summary: One record for editing, with its attendance
      description: |
        Active class (404), then sessions:update on it (403 "You do not have permission to manage this class"). The session must belong to the class (404 "Session not found").
        Slice: features/conduction-get/ConductionGet.cs.
      security:
        - memberToken: []
      parameters:
        - {name: class_id, in: path, required: true, schema: {type: string}}
        - {name: session_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: "{class, session, attendance: [{token, name, present, recitation, extra}], holyQuran}"
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    put:
      operationId: updateClassConduction
      summary: Replace a record and its attendance (within ten days of its making)
      description: |
        Active class (404), then sessions:update on it (403 "You do not have permission to manage this class"). The session must belong to the class (404), still be editable (403 "Session is not editable"); then the body as for the POST (422); another session on the new day is 409.
        Slice: features/conduction-update/ConductionUpdate.cs. Event classes.session_updated. Teacher, author and creation time stay.
      security:
        - memberToken: []
      parameters:
        - {name: class_id, in: path, required: true, schema: {type: string}}
        - {name: session_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: "the saved session"
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /classes/create-options:
    get:
      operationId: getClassCreateOptions
      summary: What the create-class form offers
      description: |
        classes:create at any scope (403). genders: each of 1, 2 the caller may create for; tags: live tags by name; timezones: 121 zones, first label each.
        Slice: features/class-create-options/ClassCreateOptions.cs; data: api/data/timezones.json.
      security:
        - memberToken: []
      responses:
        "200":
          description: "{genders: [int], tags: [{id, name}], timezones: [{timezone, label}]}"
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /classes/teachers:
    get:
      operationId: searchNewClassTeachers
      summary: Teacher candidates for a class not yet created
      description: |
        Query gender (2 only when exactly "2", else 1) and q (trimmed; empty gives an empty list). classes:create for that gender (403). At most 20, by name; a gents class takes gents only.
        Slice: features/class-create-teachers/ClassCreateTeachers.cs; pool: domain/TeacherSearch.cs.
      security:
        - memberToken: []
      parameters:
        - {name: gender, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
      responses:
        "200":
          description: "{teachers: [{token, name}]}"
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /classes/{class_id}/students:
    get:
      operationId: listClassStudents
      summary: A class's active roster
      description: |
        Active complete class (404), class-students:read on it (403). email, mobile and notes are null unless the caller holds classes:update on the class.
        Slice: features/class-students/ClassStudents.cs.
      security:
        - memberToken: []
      parameters:
        - {name: class_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: "{students: [{token, name, email, mobile, joinedOn, notes, mcqAdmin}]}"
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    post:
      operationId: addClassStudent
      summary: Enrol one member in a class
      description: |
        Body {token}. Active complete class (404), students:enrol on it (403), token a JSON integer above 0 (422), already on the roster is a no-op, a non-member or a known gender other than the class's is 422. Answers with the roster payload.
        Slice: features/class-student-add/ClassStudentAdd.cs. Event: classes.student_enrolled (source added).
      security:
        - memberToken: []
      parameters:
        - {name: class_id, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: The body described above
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /classes/{class_id}/teachers:
    get:
      operationId: searchClassTeachers
      summary: Teacher candidates for an existing class
      description: |
        Active complete class (404), classes:update on it (403). q trimmed; empty gives an empty list. At most 20, by name; a gents class takes gents only.
        Slice: features/class-teachers/ClassTeachers.cs; pool: domain/TeacherSearch.cs.
      security:
        - memberToken: []
      parameters:
        - {name: class_id, in: path, required: true, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
      responses:
        "200":
          description: "{teachers: [{token, name}]}"
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /classes/{class_id}/schedule:
    get:
      operationId: getClassSchedule
      summary: A class's schedule slots and the timezones to pick from
      description: |
        Active complete class (404), classes:update or classes:schedule on it (403).
        Slice: features/class-schedule/ClassSchedule.cs.
      security:
        - memberToken: []
      parameters:
        - {name: class_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: "{schedules: [{id, day, hour, minute, timezone}], timezones: [{timezone, label}]}"
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    put:
      operationId: putClassSchedule
      summary: Replace the class's weekly slots
      description: |
        Body {schedules: [{id?, day 1-7, hour 0-23, minute 0-59, timezone}]}, at most 21. Same guards as GET (404, 403), then 422. Answers like GET.
        Slice: features/class-schedule-update/ClassScheduleUpdate.cs. Event: classes.schedule_replaced.
      security:
        - memberToken: []
      parameters:
        - {name: class_id, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: The body described above
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /classes/{class_id}/manage:
    get:
      operationId: getClassManage
      summary: Everything the manage screen needs
      description: |
        Active complete class (404), classes:update on it (403). {class, tags, schedules (with topics), lookups, can, students, removedStudents, mcqStudents, transferHistory, destinations}.
        Slice: features/class-manage/ClassManage.cs; payload: domain/ManagePayload.cs, domain/ClassRoster.cs.
      security:
        - memberToken: []
      parameters:
        - {name: class_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The body described above
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /classes/{class_id}/students/performance:
    get:
      operationId: getClassStudentsPerformance
      summary: Each student's attendance, quiz results and recitation over a range
      description: |
        Active complete class (404), mcqs:manage on it (403), then from and to (YYYY-MM-DD, at most 366 days apart; default the year to today) (422).
        Slice: features/class-students-performance/ClassStudentsPerformance.cs.
      security:
        - memberToken: []
      parameters:
        - {name: class_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The body described above
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /classes/{class_id}/students/{token}/class-admin:
    put:
      operationId: setClassStudentAdmin
      summary: Set or clear a student's MCQ-admin flag
      description: |
        Body {status: true|false}. Active complete class (404), class-students:update on it (403), the member is on the active roster (404), status is a JSON bool (422). Answers with the roster payload.
        Slice: features/class-student-admin/ClassStudentAdmin.cs. Event: classes.student_class_admin_changed.
      security:
        - memberToken: []
      parameters:
        - {name: class_id, in: path, required: true, schema: {type: string}}
        - {name: token, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: The body described above
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /classes/{class_id}/students/{token}/remove:
    post:
      operationId: removeClassStudent
      summary: Take a student off a class
      description: |
        Body {reason} (trimmed, 1 to 500 characters, 422). Active complete class (404), students:enrol on it (403), the member is on the active roster (404). Writes every enrolment row of the pair. Answers with the roster payload.
        Slice: features/class-student-remove/ClassStudentRemove.cs. Event: classes.student_removed.
      security:
        - memberToken: []
      parameters:
        - {name: class_id, in: path, required: true, schema: {type: string}}
        - {name: token, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: The body described above
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /classes/{class_id}/students/{token}/restore:
    post:
      operationId: restoreClassStudent
      summary: Put a removed student back
      description: |
        No body is read. Active complete class (404), students:enrol on it (403), the member is on the removed list (404). Writes every enrolment row of the pair. Answers with the roster payload.
        Slice: features/class-student-restore/ClassStudentRestore.cs. Event: classes.student_restored.
      security:
        - memberToken: []
      parameters:
        - {name: class_id, in: path, required: true, schema: {type: string}}
