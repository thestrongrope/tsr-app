# The PRODUCTION stack. The deployment tool (Dokploy) builds and runs it from this file; see docs/deployment.md.
# Never run it on a developer's machine with real settings. For local work use docker-compose.dev.yml (tools/dev-stack.sh, tools/test-stack.sh).
#
# What it must never hold (hosts/api/tests/ProductionStackTests.cs fails the build otherwise):
#   - test members or the sign-in test double of the local stacks;
#   - a published port: only api, site and app are reached from outside, through the deployment tool's proxy (Traefik);
#   - a proxy of its own: the route table of hosts/gateway is for the dev and test stacks;
#   - a secret's value: every secret is a ${NAME} the deployment tool supplies, and a required one stops the start when it is missing.
#
# Start order: db healthy, then db-role (one-off), then migrate (one-off), then content-load (one-off), then api and workers, then site-build (one-off, after content-load and api).
# The database lives in the volume db-data. Removing that volume removes every member's data.

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: tsr
      POSTGRES_USER: tsr
      POSTGRES_PASSWORD: ${TSR_DB_OWNER_PASSWORD:?TSR_DB_OWNER_PASSWORD is not set}
    volumes:
      # postgres:18 keeps its data in a versioned folder below /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tsr", "-d", "tsr"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off: the API's limited role (no superuser, no DDL). Created when missing; its password is set at every start, so a changed
  # setting takes effect. psql reads the password from the environment (\getenv), so it is never an argument and no file is mounted.
  # The migrate job grants this role the domain schemas (shared/api/DomainContexts.cs).
  db-role:
    image: postgres:18
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -h db -U tsr -d tsr <<'SQL'
        \getenv pw TSR_APP_DB_PASSWORD
        SELECT 'CREATE ROLE tsr_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS'
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'tsr_app') \gexec
        SELECT format('ALTER ROLE tsr_app PASSWORD %L', :'pw') \gexec
        SQL
    environment:
      PGPASSWORD: ${TSR_DB_OWNER_PASSWORD:?TSR_DB_OWNER_PASSWORD is not set}
      TSR_APP_DB_PASSWORD: ${TSR_APP_DB_PASSWORD:?TSR_APP_DB_PASSWORD is not set}
    depends_on:
      db:
        condition: service_healthy

  # One-off: the API's JIT build (target migrate: Entity Framework cannot be native) run with --migrate applies every domain's migrations that are
  # not applied yet, as the owner role.
  migrate:
    build:
      context: .
      dockerfile: hosts/api/Dockerfile
      target: migrate
    restart: "no"
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TSR_DB: "Host=db;Port=5432;Database=tsr;Username=tsr;Password=${TSR_DB_OWNER_PASSWORD:?TSR_DB_OWNER_PASSWORD is not set}"
    depends_on:
      db-role:
        condition: service_completed_successfully

  # HTML to PDF for the report downloads. Only the api reaches it. The image ships curl (verified with docker run for the dev stack).
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    # One render may take as long as the API waits for it (60 s); the image's own default is 30 s.
    command: ["gotenberg", "--api-timeout=60s"]
    environment:
      # The report HTML references nothing outside itself: Chromium may fetch no address at all.
      CHROMIUM_DENY_PRIVATE_IPS: "true"
      CHROMIUM_DENY_PUBLIC_IPS: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  elasticsearch:
    image: elastic/elasticsearch:9.2.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${TSR_ELASTICSEARCH_PASSWORD:?TSR_ELASTICSEARCH_PASSWORD is not set}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      # The official image ships curl. $$ is a literal $ for the container's shell.
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # The embedding service of lecture search (hosts/embeddings: BAAI/bge-small-en-v1.5, the model that made the stored document vectors). Reached by the other services only: no port, no setting.
  # About 260 MB at rest; the 1 GB limit stops a runaway request, not a normal one. The model is in the image, so it starts offline; the image has its own Python health check (no curl in it).
  embeddings:
    build:
      context: hosts/embeddings
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  # The native image (target native: one binary, no .NET runtime), as are content-load and workers. Reached from outside: the deployment tool
  # attaches the API's host name to it, port 8080. It answers unknown paths itself and reads the caller's address from the proxy's
  # X-Forwarded-For (shared/api/ClientAddress.cs).
  api:
    build:
      context: .
      dockerfile: hosts/api/Dockerfile
      target: native
    restart: unless-stopped
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: Production
      TSR_DB: "Host=db;Port=5432;Database=tsr;Username=tsr_app;Password=${TSR_APP_DB_PASSWORD:?TSR_APP_DB_PASSWORD is not set}"
      TSR_FIREBASE_PROJECT_ID: ${TSR_FIREBASE_PROJECT_ID:?TSR_FIREBASE_PROJECT_ID is not set}
      TSR_GOTENBERG_URL: http://gotenberg:3000
      TSR_ELASTICSEARCH_URL: http://elasticsearch:9200
      TSR_ELASTICSEARCH_PASSWORD: ${TSR_ELASTICSEARCH_PASSWORD:?TSR_ELASTICSEARCH_PASSWORD is not set}
      # Lecture search: the embedding service (the meaning layer is on at the evaluated weight; the service being down only turns it off for that request).
      # TSR_LECTURES_FILE is set on the workers service only, the one that runs the feed: the lecture file is in the image.
      TSR_EMBEDDINGS_URL: http://embeddings:8000
      TSR_LECTURES_SEMANTIC_WEIGHT: "0.25"
      # Optional. Empty: no push, no account deletion at Firebase, no sheet refresh (each answers as its slice documents).
      TSR_GOOGLE_SERVICE_ACCOUNT_B64: ${TSR_GOOGLE_SERVICE_ACCOUNT_B64:-}
      TSR_PUBLIC_WEB_BASE: ${TSR_PUBLIC_WEB_BASE:-}
      TSR_QUIZ_SETTINGS_SHEET_ID: ${TSR_QUIZ_SETTINGS_SHEET_ID:-}
      # The published content baked into the image (hosts/api/Dockerfile); content-load copies it into the database at each deploy.
      TSR_CONTENT_DIR: /var/tsr/content
      TSR_NOTIFIER_URL: ${TSR_NOTIFIER_URL:-}
      # The browser origins that may call the API (a web build of the app), comma-separated. Empty allows none.
      TSR_CORS_ORIGINS: ${TSR_CORS_ORIGINS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      gotenberg:
        condition: service_healthy

  # One-off: the API image run with --load-content copies the image's published content into the database, then stops. When it cannot (it exits 1),
  # Docker tries again, five times at most, and site-build does not start, so the pages built before stay in the volume.
  content-load:
    build:
      context: .
      dockerfile: hosts/api/Dockerfile
      target: native
    restart: on-failure:5
    command: ["--load-content"]
    environment:
      <<: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The API image in its second run mode: it runs the workers named in TSR_WORKERS. Empty (the default) runs none, so a deploy alone
  # sends nothing outward. Naming a sending worker (push-drain, class-schedules) is a decision made in the deployment tool's settings.
  workers:
    build:
      context: .
      dockerfile: hosts/api/Dockerfile
      target: native
    restart: unless-stopped
    command: ["--workers"]
    environment:
      <<: *api-environment
      TSR_WORKERS: ${TSR_WORKERS:-}
      # The full lecture file baked into the image (hosts/api/Dockerfile): the lecture index is fed from it by library-search-feed.
      TSR_LECTURES_FILE: /var/tsr/lectures/lectures.ndjson
    depends_on:
      migrate:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy

  # The static site generator: reads the running API and writes the pages into the volume site-data. It collects every page before it
  # touches the volume, so an API that is not ready yet, or answers an error, leaves the pages built before in place; Docker then tries
  # again, five times at most.
  site-build:
    build:
      context: .
      dockerfile: hosts/site/Dockerfile
    restart: on-failure:5
    # As root, unlike the image's default user: the volume belongs to root whichever container creates it first, and this job must
    # replace its files. It serves nothing and is reached by nothing.
    user: "0:0"
    environment:
      TSR_BASE_URL: http://api:8080
      # A robots.txt that keeps crawlers out, until the site is more than a sample.
      TSR_SITE_NO_CRAWL: "true"
    volumes:
      - site-data:/site
    depends_on:
      content-load:
        condition: service_completed_successfully
      api:
        condition: service_started

  # The web copy of the member app (hosts/app/Dockerfile): Flutter Web as a release build, served by nginx, which forwards nothing. The
  # deployment tool attaches the app's host name to it, port 80. The API's public address is compiled into the app at build time, so a change
  # of TSR_APP_API_BASE_URL needs a rebuild. The browser calls the API itself: the API answers it only when TSR_CORS_ORIGINS names the app's
  # origin, and sign-in works only when the app's host name is an authorized domain of the Firebase project. The image takes minutes to build.
  app:
    build:
      context: .
      dockerfile: hosts/app/Dockerfile
      args:
        TSR_API_BASE_URL: ${TSR_APP_API_BASE_URL:?TSR_APP_API_BASE_URL is not set}
    restart: unless-stopped
    healthcheck:
      # Alpine ships BusyBox wget only: no curl, no --spider.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s

  # Serves the generated pages, read-only, with the image's own settings: it forwards nothing. The deployment tool attaches the site's
  # host name to it, port 80. Until the first build has written a home page it answers 403 and is reported unhealthy.
  # Its image is the stock server with one setting baked in (hosts/site/Dockerfile.server): an unknown address answers 404
  # with the site's own not-found page. Nothing is mounted but the pages.
  site:
    build:
      context: hosts/site
      dockerfile: Dockerfile.server
    restart: unless-stopped
    volumes:
      # nocopy: the volume must not start with the image's own welcome page.
      - type: volume
        source: site-data
        target: /usr/share/nginx/html
        read_only: true
        volume:
          nocopy: true
    healthcheck:
      # Alpine ships BusyBox wget only: no curl, no --spider.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 5
      # The proxy sends nothing to a container that is not healthy yet. Without these two the first check runs 10 s after a start,
      # so a deploy that replaces this container left the site unanswered for those 10 s. Needs Docker Engine 25 or later.
      start_period: 10s
      start_interval: 1s

volumes:
  db-data:
  es-data:
  site-data:
