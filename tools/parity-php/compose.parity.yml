# PHP API (tsr-account) on SYNTHETIC data only, for contract tests. Local only.
# No container_name anywhere: names are derived from the project, so nothing
# here can collide with the tsr-account or tsr-app-dev containers.
# Source: build/parity-php/src (a clean `git archive` of tsr-account develop).
name: tsr-parity

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${PARITY_DB_ROOT_PASSWORD}
      MARIADB_USER: ${PARITY_DB_USER}
      MARIADB_PASSWORD: ${PARITY_DB_PASSWORD}
    volumes:
      - parity_db:/var/lib/mysql
      - ./db-init.sql:/docker-entrypoint-initdb.d/10-synth.sql:ro
    networks: [parity]
    healthcheck:
      # mariadb:11.4 has no mysqladmin; healthcheck.sh ships in the image.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot, on demand (profile "load"): builds the synthetic database.
  synth-build:
    image: ghcr.io/astral-sh/uv:0.9-python3.12-bookworm-slim
    profiles: ["load"]
    restart: "no"
    working_dir: /work
    command: ["uv", "run", "--frozen", "python", "-m", "synth", "build"]
    environment:
      UV_PROJECT_ENVIRONMENT: /tmp/synth-venv
      UV_CACHE_DIR: /tmp/uv-cache
      SYNTH_DB_HOST: db
      SYNTH_DB_USER: ${PARITY_DB_USER}
      SYNTH_DB_PASSWORD: ${PARITY_DB_PASSWORD}
      SYNTH_DB_NAME: ${PARITY_DB_NAME}
    volumes:
      - ../../build/parity-php/src/tools/synthetic-data:/work:ro
    networks: [parity]
    depends_on:
      db:
        condition: service_healthy

  # The service name and port are fixed: the PHP verifier only accepts the
  # emulator at firebase-emulator:9099. Accounts live in memory.
  firebase-emulator:
    image: node:22-alpine
    command: ["npx", "--yes", "firebase-tools@15.34.2", "emulators:start", "--only", "auth", "--project", "${PARITY_FIREBASE_PROJECT_ID}", "--config", "/cfg/firebase.json"]
    ports:
      - "127.0.0.1:${PARITY_EMULATOR_PORT}:9099"
    volumes:
      - ../../build/parity-php/src/tools/auth-emulator:/cfg:ro
      - parity_emulator_cache:/root/.npm
    networks: [parity]
    healthcheck:
      # Alpine has no curl and BusyBox wget has no --spider; node's fetch is there.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9099/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  api:
    image: tsr-parity/php-api:local
    build:
      context: ../../build/parity-php/src
      dockerfile: .docker/Dockerfile.webapp
    # Mobile-API vhost on plain :80, as in tsr-account's docker-compose.yml.
    command: ["sh", "-c", "a2dissite 000-default && a2ensite mobileapi && exec apache2-foreground"]
    ports:
      - "127.0.0.1:${PARITY_API_PORT}:80"
    environment:
      APP_ENV: local
      MYSQL_HOST: db
      MYSQL_DATABASE: ${PARITY_DB_NAME}
      MYSQL_USER: ${PARITY_DB_USER}
      MYSQL_PASSWORD: ${PARITY_DB_PASSWORD}
      TIME_OFFSET: PT5H30M
      FIREBASE_PROJECT_ID: ${PARITY_FIREBASE_PROJECT_ID}
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
      FIREBASE_SERVICE_ACCOUNT_B64: ""
    networks: [parity]
    depends_on:
      db:
        condition: service_healthy
      firebase-emulator:
        condition: service_healthy
    healthcheck:
      # Checked in the image: php is there; curl is not relied on.
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  parity:

volumes:
  parity_db:
  parity_emulator_cache:
