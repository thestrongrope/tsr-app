# Local development stack. Run from the repo root on Windows or Mac (no Bash needed):
#   docker compose -f docker-compose.dev.yml up -d --build
# Then: gateway http://localhost:8088, database localhost:3307 (user tsr / password local-only).
# Every password here is a local-only placeholder, never a production value.

name: tsr-app-dev

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: local-only-root
      MARIADB_DATABASE: tsr
      MARIADB_USER: tsr
      MARIADB_PASSWORD: local-only
    ports:
      - "3307:3306"
    volumes:
      # First start only: db/dev-init/load.sh applies migrations in name order, then the seed.
      # To start again from scratch: docker compose -f docker-compose.dev.yml down -v
      - ./db/dev-init:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/tsr-db/migrations:ro
      - ./db/synthetic:/tsr-db/synthetic:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: hosts/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      TSR_DB: "Server=db;Port=3306;Database=tsr;User ID=tsr;Password=local-only"
    depends_on:
      db:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8088:8080"
    volumes:
      - ./hosts/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    healthcheck:
      # Alpine ships BusyBox wget only: no curl, no --spider.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/gateway-health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
