# Local development stack. Run from the repo root on Windows or Mac (no Bash needed):
#   docker compose -f docker-compose.dev.yml up -d --build
# Then: gateway http://localhost:8088, database localhost:5433 (owner tsr / password local-only).
# Both ports are published on 127.0.0.1 only. Every password here is a local-only placeholder,
# never a production value.
# Two database roles: tsr (owner, runs migrate and seed) and tsr_app (limited, the API; db/init/).
# Start order: db healthy, then migrate (one-off: every domain's EF migrations), then seed (one-off:
# synthetic members and articles), then api. To start again from scratch:
#   docker compose -f docker-compose.dev.yml down -v
# The separate synthetic TEST stack (contract tests; own containers, network and volumes) is this same file under
# the override docker-compose.test.yml (other project name, other ports): tools/test-stack.sh up/down/remove. No environment
# variable can move a stack: the dev ports are literal here.

name: tsr-app-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: tsr
      POSTGRES_USER: tsr
      POSTGRES_PASSWORD: local-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # postgres:18 keeps its data in a versioned folder below /var/lib/postgresql.
      - db-data:/var/lib/postgresql
      # Runs once, when the volume is first created: creates the limited tsr_app role.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tsr", "-d", "tsr"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The Firebase Auth emulator (Google's own, run through npx): signs in synthetic members so the API and
  # the contract tests need no Google call. Accounts live in memory; mint a token again after a restart
  # (tools/dev-auth/mint-token.sh). Published on 127.0.0.1:19099 only. Verified: node:22-alpine ships node
  # and npx; busybox wget is not relied on (the check uses node fetch, as tools/parity-php does).
  firebase-emulator:
    image: node:22-alpine
    command: ["npx", "--yes", "firebase-tools@15.34.2", "emulators:start", "--only", "auth", "--project", "demo-tsr-app", "--config", "/cfg/firebase.json"]
    ports:
      - "127.0.0.1:19099:9099"
    volumes:
      - ./tools/auth-emulator:/cfg:ro
      - emulator-cache:/root/.npm
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9099/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # HTML to PDF with Chromium for the report downloads (platform ReportExport). No published port: only the api reaches it, on the compose
  # network. Verified with docker run: the image ships curl (not wget), so the check uses curl; /health answers {"status":"up",...}.
  gotenberg:
    image: gotenberg/gotenberg:8
    environment:
      # The report HTML references nothing outside itself: Chromium may fetch no address at all (defence in depth).
      CHROMIUM_DENY_PRIVATE_IPS: "true"
      CHROMIUM_DENY_PUBLIC_IPS: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    # The same image as the API, run once with --migrate (production: the same, as a Dokploy job).
    build:
      context: .
      dockerfile: hosts/api/Dockerfile
    command: ["--migrate"]
    environment:
      # Not Development: migrating must work in any environment, without the dev verifier.
      ASPNETCORE_ENVIRONMENT: Production
      TSR_DB: "Host=db;Port=5432;Database=tsr;Username=tsr;Password=local-only"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    # Synthetic dev data only. Never run against production. Safe to run again: it skips rows that exist.
    image: postgres:18
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "db", "-U", "tsr", "-d", "tsr", "-f", "/tsr-db/synthetic/seed.sql"]
    environment:
      PGPASSWORD: local-only
    volumes:
      - ./db/synthetic:/tsr-db/synthetic:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: hosts/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      TSR_DB: "Host=db;Port=5432;Database=tsr;Username=tsr_app;Password=local-only-app"
      TSR_FIREBASE_PROJECT_ID: demo-tsr-app
      TSR_AUTH_EMULATOR_HOST: firebase-emulator:9099
      # The synthetic catalog GET /app-version and /release-notes read (the parity stack mounts the same file).
      TSR_APP_VERSIONS_FILE: /etc/tsr/app_versions.json
      # Where PDF downloads are rendered (the gotenberg service). Required: the API does not start without it. A renderer that is down answers 503 for a PDF; xlsx still works.
      TSR_GOTENBERG_URL: http://gotenberg:3000
      # Where GET /search asks. Empty (the default) means no index: every search answers "unavailable". tools/dev-stack.sh sets it together with the
      # compose profile "workers", which starts the elasticsearch service below.
      TSR_ELASTICSEARCH_URL: ${TSR_ELASTICSEARCH_URL:-}
      TSR_ELASTICSEARCH_PASSWORD: local-only-es
    volumes:
      - ./domains/platform/spec/tests/app_versions.synthetic.json:/etc/tsr/app_versions.json:ro
    depends_on:
      seed:
        condition: service_completed_successfully
      firebase-emulator:
        condition: service_healthy

  # Elasticsearch and the background workers start only with the compose profile "workers" (COMPOSE_PROFILES=workers):
  # a plain `up` of the dev stack starts neither. The dev database may hold real member data and real device tokens, so
  # never set TSR_WORKERS to a sending worker (push-drain, class-schedules) on the dev stack. tools/test-stack.sh turns the
  # profile on for the synthetic test stack only, with TSR_WORKERS=search-feed (docker-compose.test.yml).
  elasticsearch:
    # The image and settings production runs for the PHP system (tsr-account docker-compose.yml).
    image: elastic/elasticsearch:9.2.3
    profiles: ["workers"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: local-only-es
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      # The official image ships curl (production uses the same check).
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # The API image in its second run mode: it serves only /health and runs the workers named in TSR_WORKERS (none by default).
  workers:
    build:
      context: .
      dockerfile: hosts/api/Dockerfile
    profiles: ["workers"]
    command: ["--workers"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      TSR_DB: "Host=db;Port=5432;Database=tsr;Username=tsr_app;Password=local-only-app"
      # The worker host loads the same modules as the API, so it takes the same identity settings.
      TSR_FIREBASE_PROJECT_ID: demo-tsr-app
      TSR_AUTH_EMULATOR_HOST: firebase-emulator:9099
      TSR_GOTENBERG_URL: http://gotenberg:3000
      TSR_ELASTICSEARCH_URL: http://elasticsearch:9200
      TSR_ELASTICSEARCH_PASSWORD: local-only-es
      TSR_WORKERS: ${TSR_WORKERS:-}
    depends_on:
      seed:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./hosts/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    healthcheck:
      # Alpine ships BusyBox wget only: no curl, no --spider.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/gateway-health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
  emulator-cache:
  es-data:
